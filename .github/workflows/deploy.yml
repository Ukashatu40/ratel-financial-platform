name: Deploy

# Manual trigger only — deliberately NOT auto-deploy-on-push-to-main.
# This is a financial system-of-record; every production deploy should be
# a deliberate action someone takes, not a side effect of merging a PR.
# Run it from the Actions tab (Deploy workflow → "Run workflow"), choosing
# the branch/tag to deploy.
#
# Requires these repository secrets to be set (Settings → Secrets and
# variables → Actions) before this workflow can do anything — see
# DEPLOYMENT.md for how to generate/install the deploy key on the VPS:
#   VPS_HOST        — the VPS's IP or hostname
#   VPS_USER         — SSH user with docker permissions on the VPS
#   VPS_SSH_KEY      — private key for that user (ssh-ed25519 recommended)
#   VPS_DEPLOY_PATH  — absolute path to the repo checkout on the VPS,
#                      e.g. /home/deploy/ratel-financial-platform
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin
            git checkout "${{ github.sha }}"
            ./ops/deploy/deploy.sh
